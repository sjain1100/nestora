services:
  - type: web
    name: nestora-web
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: nestora-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          type: web
          name: nestora-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: nestora-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: nestora/properties
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
