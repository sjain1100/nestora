<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broker Sign In | NESTORA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">
    <header class="navbar inner-navbar">
        <a href="index.html" class="logo"><span>NEST</span>ORA</a>
        <nav class="nav-links"><a href="properties.html">Properties</a><a href="account.html">Account</a></nav>
    </header>
    <main class="account-page">
        <div class="account-heading"><p class="section-label">BROKER PORTAL</p><h1>Grow your <span>business.</span></h1></div>
        <p id="accountMessage" class="account-message" role="status" hidden></p>
        <section class="account-panel">
            <h2>Broker sign in</h2>
            <form id="loginForm" data-role="broker" class="account-form">
                <label>Email<input name="email" type="email" autocomplete="email" required></label>
                <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
                <button class="form-submit" type="submit">Sign in as broker</button>
            </form>
            <p>Need a broker account? <a href="account.html">Register as a broker</a>.</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
