<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | NESTORA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="demo.css"></head><body class="inner-page"><header class="navbar inner-navbar"><a href="index.html" class="logo"><span>NEST</span>ORA</a><nav class="nav-links"><a href="properties.html">Properties</a><a href="login.html">Login</a></nav></header><main class="demo-auth"><div><p class="section-label">JOIN NESTORA</p><h1>A better way<br><span>to find your place.</span></h1><p>Create a profile for a personalized property experience.</p></div><section class="account-panel"><h2>Create your account</h2><p class="demo-note">Create a buyer, broker, or seller account. Admin accounts are created privately.</p><div id="notice" class="account-message" hidden></div><form id="demoRegister" class="account-form demo-register"><label>Account type<select name="role" id="registerRole"><option value="buyer">Buyer</option><option value="broker">Broker</option><option value="seller">Seller</option></select></label><label>Full name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Phone number<input name="phone" type="tel" required></label><label>Password<input id="password" name="password" type="password" minlength="10" required><small>Use at least 10 characters with upper and lower case letters and a number.</small></label><label>Confirm password<input name="confirmPassword" type="password" minlength="10" required></label><div class="strength-track"><span id="strengthBar"></span></div><div id="brokerFields" hidden><label>Agency name (optional)<input name="agencyName"></label><label>License / registration number<input name="licenseNumber"></label><label>Years of experience<input name="experience" type="number" min="0" max="60"></label></div><div id="sellerFields" hidden><label>Seller type<select name="sellerType" id="sellerType"><option value="individual">Individual owner</option><option value="company">Company</option></select></label><label id="organizationNameRow" hidden>Organization name<input name="organizationName" maxlength="120"></label></div><label class="check-line"><input type="checkbox" name="terms" required> I agree to the terms and privacy policy</label><button class="form-submit">Create account</button></form><p class="demo-auth-links">Already registered? <a href="login.html">Sign in</a></p></section></main><script src="api-client.js"></script><script src="frontend-auth.js"></script></body></html>
